name: PHP tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        guzzle: ['^7.0', '^8.0']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish
      - name: Resolve the Guzzle version under test
        run: composer update --with 'guzzlehttp/guzzle:${{ matrix.guzzle }}' --with-all-dependencies --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests without API calls
        run: php vendor/bin/phpunit --exclude-group internet
